packages:
  - "."
  - "site"

minimumReleaseAge: 10080

# pg@8.21.0 pulls pg-cloudflare@1.4.0; exclude until it ages past the gate.
minimumReleaseAgeExclude:
  - pg-cloudflare

# @cursor/sdk needs sqlite3 native binding when PI_PROVIDER=cursor.
# Transitive deps (esbuild, protobufjs, etc.) keep build scripts off; warn only.
strictDepBuilds: false
allowBuilds:
  sqlite3: true
