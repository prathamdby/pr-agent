# Production override: no local defaults. The env file must be named explicitly.
# Usage: PR_AGENT_ENV_FILE=/path/to/.env docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The pr-agent-data volume holds every durable byte (app_state.sqlite,
# pi_durable.sqlite, and the single-writer lock). Back it up and never mount it
# into a second container.
services:
  pr-agent:
    env_file:
      - ${PR_AGENT_ENV_FILE:?set PR_AGENT_ENV_FILE}
