# Production override: require explicit Postgres credentials (no local defaults).
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# Set POSTGRES_DB, POSTGRES_USER, and POSTGRES_PASSWORD in the env file.
# DATABASE_URL is injected into the app containers as written.
# If postgres stays in this compose file, use hostname `postgres`, not localhost.
# localhost inside pr-agent-web / pr-agent-worker is the app container.
services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

  pr-agent-web:
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}

  pr-agent-worker:
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
