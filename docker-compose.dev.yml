# Maintainer-local stack. One pr-agent process, Caddy, and a Cloudflare quick
# tunnel. Production hosting still uses docker-compose.yml. That file has no
# Caddy and no tunnel.
#
#   docker compose -f docker-compose.dev.yml up -d --build
#   node dev/print-public-webhook-url.cjs
#
# Mock GitHub App fields live in dev/mock.env. The boot script generates a
# throwaway PEM at process start. They are not a real App. For live deliveries:
#   PR_AGENT_ENV_FILE=.env docker compose -f docker-compose.dev.yml up -d --build
#
# The tunnel origin is HTTP to the pr-agent service. Paste the printed
# trycloudflare URL on the GitHub App. The hostname changes on restart.
#
# Published ports bind 127.0.0.1. Opening 80 or 443 on all interfaces is an
# operator choice and exposes the laptop on the LAN.
#
# SQLite data lives in pr-agent-data-dev. Production Compose uses pr-agent-data.
# compose down keeps the volume. Do not run both Compose files at once, and do
# not point a host `npm run dev` at this volume while the container runs.
services:
  pr-agent:
    build: .
    image: pr-agent:local
    env_file:
      - ${PR_AGENT_ENV_FILE:-dev/mock.env}
    environment:
      PORT: "7224"
      SQLITE_DIR: "/data"
    command: ["node", "/app/boot-with-mock-key.cjs"]
    volumes:
      - ./dev/boot-with-mock-key.cjs:/app/boot-with-mock-key.cjs:ro
      - pr-agent-data-dev:/data
    ports:
      - "127.0.0.1:7224:7224"
    restart: unless-stopped
    stop_grace_period: 40s
    deploy:
      replicas: 1
      update_config:
        order: stop-first
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7224/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./dev/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - pr-agent
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.6.0
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://pr-agent:7224
    depends_on:
      pr-agent:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pr-agent-data-dev:
  caddy-data:
  caddy-config:
