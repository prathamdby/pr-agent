name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - ".github/workflows/ci.yml"
              - ".dockerignore"
              - ".env.example"
              - ".node-version"
              - ".npmrc"
              - ".oxfmtrc.json"
              - ".oxlintrc.json"
              - "Dockerfile"
              - "knip.json"
              - "migrations/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "scripts/**"
              - "src/**"
              - "test/**"
              - "tsconfig*.json"
              - "vitest*.config.ts"
              - "docs/**"
            site:
              - ".github/workflows/ci.yml"
              - ".node-version"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "site/**"
              - "scripts/check-bundle-size.mjs"
              - "scripts/check-site-boundary.mjs"

  check:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: nubjs/setup-nub@v0
        with:
          cache: true
          node-version-file: .node-version
      - run: nub ci --filter pr-agent... --filter pr-agent-landing...
      - run: nub run check:effect-versions
      - run: nub run check:prod-deps
      - run: nub run check:site-boundary
      - run: nub dedupe --check
      - run: nub run check:code
      - run: nub run check:knip
      - run: nub run check:jscpd
      - name: Unit tests with JSON report + coverage
        run: nub run test -- --coverage --reporter=default --reporter=json --outputFile=test-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            test-results.json
            coverage/**
          if-no-files-found: ignore
      - run: nub run build

  integration:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pr_agent
          POSTGRES_USER: pr_agent
          POSTGRES_PASSWORD: pr_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pr_agent -d pr_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pr_agent:pr_agent@localhost:5432/pr_agent
    steps:
      - uses: actions/checkout@v4
      - uses: nubjs/setup-nub@v0
        with:
          cache: true
          node-version-file: .node-version
      - run: nub ci --filter pr-agent...
      - run: nub run test:integration

  docker:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: nubjs/setup-nub@v0
        with:
          cache: true
          node-version-file: .node-version
      - run: nub ci --filter pr-agent... --filter pr-agent-landing...
      - run: nub run lint
      - run: nub run fmt:check
      - run: nub run site:test
      - run: nub run --node site:build
      - run: nub run check:bundle-size
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-bundle-stats
          path: site/stats.html
          if-no-files-found: ignore

  # Always-run aggregator for branch protection (B7). Skipped path-filtered
  # jobs count as success so protection can require this single check.
  ci-required:
    if: always()
    needs: [check, integration, docker, site]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate path-filtered job results
        run: |
          set -euo pipefail
          results=(
            "check=${{ needs.check.result }}"
            "integration=${{ needs.integration.result }}"
            "docker=${{ needs.docker.result }}"
            "site=${{ needs.site.result }}"
          )
          echo "Job results: ${results[*]}"
          for entry in "${results[@]}"; do
            r="${entry#*=}"
            case "$r" in
              success|skipped) ;;
              *)
                echo "Required job ended with $r ($entry)"
                exit 1
                ;;
            esac
          done
          echo "ci-required: all needed jobs succeeded or were skipped"
