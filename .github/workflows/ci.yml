name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - ".github/workflows/ci.yml"
              - ".dockerignore"
              - ".env.example"
              - ".npmrc"
              - "Dockerfile"
              - "migrations/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "scripts/**"
              - "src/**"
              - "test/**"
              - "tsconfig*.json"
              - "vitest*.config.ts"
            site:
              - ".github/workflows/ci.yml"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "site/**"

  check:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter pr-agent...
      - run: pnpm run check:effect-versions
      - run: pnpm run check:prod-deps
      - run: pnpm run typecheck
      - run: pnpm run lint:backend
      - run: pnpm run fmt:check
      - run: pnpm test
      - run: pnpm run build

  integration:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pr_agent
          POSTGRES_USER: pr_agent
          POSTGRES_PASSWORD: pr_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pr_agent -d pr_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pr_agent:pr_agent@localhost:5432/pr_agent
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter pr-agent...
      - run: pnpm run test:integration

  docker:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter pr-agent-landing...
      - run: pnpm run site:build
