name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - ".github/workflows/ci.yml"
              - ".dockerignore"
              - ".env.example"
              - ".gitignore"
              - ".node-version"
              - ".npmrc"
              - ".oxfmtrc.json"
              - ".oxlintrc.json"
              - "AGENTS.md"
              - "CODEOWNERS"
              - "Dockerfile"
              - "README.md"
              - "docs/**"
              - "migrations/**"
              - "package.json"
              - "nub.lock"
              - "nub.jsonc"
              - "scripts/**"
              - "src/**"
              - "test/**"
              - "tsconfig*.json"
              - "vitest*.config.ts"
            site:
              - ".github/workflows/ci.yml"
              - ".node-version"
              - "package.json"
              - "nub.lock"
              - "nub.jsonc"
              - "scripts/check-site-design.mjs"
              - "scripts/baselines/site-design-baseline.json"
              - "site/**"

  # `check` always runs. A skipped check fails the gate. `integration`,
  # `docker`, and `site` may skip only when their path filter did not select
  # them. `commit-messages` skips on a push to main. `changes` is in `needs`
  # so a paths-filter failure cannot silently green the gate.
  gate:
    needs: [changes, check, commit-messages, integration, docker, site]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "changes=${{ needs.changes.result }} check=${{ needs.check.result }} commit-messages=${{ needs.commit-messages.result }} integration=${{ needs.integration.result }} docker=${{ needs.docker.result }} site=${{ needs.site.result }} backend=${{ needs.changes.outputs.backend }} site_filter=${{ needs.changes.outputs.site }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then echo "gate: failing on changes=${{ needs.changes.result }}"; exit 1; fi
          if [ "${{ needs.check.result }}" != "success" ]; then echo "gate: check must succeed, got ${{ needs.check.result }}"; exit 1; fi
          case "${{ needs.commit-messages.result }}" in
            success|skipped) ;;
            *) echo "gate: failing on commit-messages=${{ needs.commit-messages.result }}"; exit 1 ;;
          esac
          require_selected() {
            name="$1"
            result="$2"
            selected="$3"
            if [ "$selected" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "gate: $name selected but result=$result"
                exit 1
              fi
            else
              case "$result" in
                success|skipped) ;;
                *) echo "gate: failing on $name=$result"; exit 1 ;;
              esac
            fi
          }
          require_selected integration "${{ needs.integration.result }}" "${{ needs.changes.outputs.backend }}"
          require_selected docker "${{ needs.docker.result }}" "${{ needs.changes.outputs.backend }}"
          require_selected site "${{ needs.site.result }}" "${{ needs.changes.outputs.site }}"
          echo "gate green"

  check:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: nubjs/setup-nub@v0
        with:
          cache: true
          node-version-file: .node-version
      - run: nub ci --filter pr-agent... --filter pr-agent-landing...
      - run: nub run check:effect-versions
      - run: nub run check:prod-deps
      - run: nub run check:code
      - run: nub run check:guards
      - run: nub run test
      - run: nub run build

  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch --no-tags origin "$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      - name: Check PR commit messages
        run: node scripts/check-commit-messages.mjs --base "origin/$BASE_REF" --head HEAD
        env:
          BASE_REF: ${{ github.base_ref }}

  integration:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pr_agent
          POSTGRES_USER: pr_agent
          POSTGRES_PASSWORD: pr_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pr_agent -d pr_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pr_agent:pr_agent@localhost:5432/pr_agent
    steps:
      - uses: actions/checkout@v4
      - uses: nubjs/setup-nub@v0
        with:
          cache: true
          node-version-file: .node-version
      - run: nub ci --filter pr-agent...
      - run: nub run test:integration

  docker:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: nubjs/setup-nub@v0
        with:
          cache: true
          node-version-file: .node-version
      - run: nub ci --filter pr-agent... --filter pr-agent-landing...
      - run: nub run lint
      - run: nub run fmt:check
      - run: nub run check:site-design
      - run: nub run --node site:build
