name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:effect-versions
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run fmt:check
      - run: pnpm test
      - run: pnpm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pr_agent
          POSTGRES_USER: pr_agent
          POSTGRES_PASSWORD: pr_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pr_agent -d pr_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pr_agent:pr_agent@localhost:5432/pr_agent
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:integration
