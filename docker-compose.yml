# One pr-agent process owns the /data volume: app_state.sqlite, pi_durable.sqlite,
# and the pr-agent.lock.sqlite single-writer lock. Two containers must never
# share the volume, so updates stop the old container before the new one starts.
# stop_grace_period stays above SHUTDOWN_GRACE_MS (default 25s) plus 5s.
services:
  pr-agent:
    build: .
    image: pr-agent:local
    env_file:
      - ${PR_AGENT_ENV_FILE:-.env}
    environment:
      PORT: "7224"
      SQLITE_DIR: "/data"
    ports:
      - "7224:7224"
    volumes:
      - pr-agent-data:/data
    restart: unless-stopped
    stop_grace_period: 40s
    deploy:
      replicas: 1
      update_config:
        order: stop-first
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7224/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pr-agent-data:
