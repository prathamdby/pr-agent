<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">How PR Agent runs a review</title>
  <desc id="desc">A pull request on GitHub reaches web. Web stores the work in Postgres. The worker reviews it and writes back on the pull request.</desc>
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#E819A8"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243044"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="28" fill="#0D1117"/>
  <rect x="1.5" y="1.5" width="1277" height="417" rx="26.5" fill="none" stroke="#30363D" stroke-width="1.5"/>
  <rect x="0" y="0" width="1280" height="6" rx="3" fill="url(#rail)"/>

  <text x="640" y="48" text-anchor="middle" fill="#E6EDF3" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">A pull request on your project</text>
  <text x="640" y="74" text-anchor="middle" fill="#8B949E" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">GitHub to web. Web stores the work. Worker writes the review on the pull request.</text>

  <!-- connector rail -->
  <rect x="118" y="176" width="1044" height="6" rx="3" fill="url(#rail)" opacity="0.85"/>

  <!-- 1 GitHub -->
  <g transform="translate(70 112)" filter="url(#shadow)">
    <rect width="196" height="168" rx="20" fill="url(#cardGlow)" stroke="#3D444D"/>
    <circle cx="98" cy="52" r="26" fill="#21262D" stroke="#00E5FF" stroke-width="2"/>
    <circle cx="90" cy="42" r="4.2" fill="none" stroke="#00E5FF" stroke-width="2"/>
    <circle cx="90" cy="62" r="4.2" fill="none" stroke="#00E5FF" stroke-width="2"/>
    <circle cx="108" cy="52" r="4.2" fill="none" stroke="#00E5FF" stroke-width="2"/>
    <path d="M90 46v12M94 62c8 0 10-4 10-8" fill="none" stroke="#00E5FF" stroke-width="2" stroke-linecap="round"/>
    <text x="98" y="104" text-anchor="middle" fill="#E6EDF3" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">GitHub</text>
    <text x="98" y="128" text-anchor="middle" fill="#8B949E" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Pull request opens</text>
  </g>

  <!-- 2 Web -->
  <g transform="translate(306 112)" filter="url(#shadow)">
    <rect width="196" height="168" rx="20" fill="url(#cardGlow)" stroke="#3D444D"/>
    <circle cx="98" cy="52" r="26" fill="#21262D" stroke="#4CD4FF" stroke-width="2"/>
    <rect x="86" y="40" width="24" height="24" rx="3" fill="none" stroke="#4CD4FF" stroke-width="2.1"/>
    <path d="M91 47h14M91 52h14M91 57h9" stroke="#4CD4FF" stroke-width="2" stroke-linecap="round"/>
    <text x="98" y="104" text-anchor="middle" fill="#E6EDF3" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Web</text>
    <text x="98" y="128" text-anchor="middle" fill="#8B949E" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Accepts the request</text>
  </g>

  <!-- 3 Postgres -->
  <g transform="translate(542 112)" filter="url(#shadow)">
    <rect width="196" height="168" rx="20" fill="url(#cardGlow)" stroke="#3D444D"/>
    <circle cx="98" cy="52" r="26" fill="#21262D" stroke="#A78BFA" stroke-width="2"/>
    <ellipse cx="98" cy="42" rx="12" ry="5" fill="none" stroke="#A78BFA" stroke-width="2.1"/>
    <path d="M86 42v14c0 3 5 5 12 5s12-2 12-5V42" fill="none" stroke="#A78BFA" stroke-width="2.1"/>
    <text x="98" y="104" text-anchor="middle" fill="#E6EDF3" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Postgres</text>
    <text x="98" y="128" text-anchor="middle" fill="#8B949E" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Stores the work</text>
  </g>

  <!-- 4 Worker -->
  <g transform="translate(778 112)" filter="url(#shadow)">
    <rect width="196" height="168" rx="20" fill="url(#cardGlow)" stroke="#3D444D"/>
    <circle cx="98" cy="52" r="26" fill="#21262D" stroke="#F472B6" stroke-width="2"/>
    <circle cx="98" cy="52" r="8" fill="none" stroke="#F472B6" stroke-width="2.1"/>
    <path d="M98 36v6M98 62v6M82 52h6M108 52h6M87 41l4 4M105 59l4 4M109 41l-4 4M91 59l-4 4" stroke="#F472B6" stroke-width="2" stroke-linecap="round"/>
    <text x="98" y="104" text-anchor="middle" fill="#E6EDF3" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Worker</text>
    <text x="98" y="128" text-anchor="middle" fill="#8B949E" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Reads and reviews</text>
  </g>

  <!-- 5 Pull request -->
  <g transform="translate(1014 112)" filter="url(#shadow)">
    <rect width="196" height="168" rx="20" fill="url(#cardGlow)" stroke="#3D444D"/>
    <circle cx="98" cy="52" r="26" fill="#21262D" stroke="#E819A8" stroke-width="2"/>
    <path d="M86 44h16a4 4 0 0 1 4 4v8l-6-3H86a4 4 0 0 1-4-4v-1a4 4 0 0 1 4-4z" fill="none" stroke="#E819A8" stroke-width="2.1" stroke-linejoin="round"/>
    <path d="M90 50h10M90 55h6" stroke="#E819A8" stroke-width="1.8" stroke-linecap="round"/>
    <text x="98" y="104" text-anchor="middle" fill="#E6EDF3" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Your PR</text>
    <text x="98" y="128" text-anchor="middle" fill="#8B949E" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Notes land on the lines</text>
  </g>

  <!-- chevrons on the rail -->
  <polygon points="286,171 298,179 286,187" fill="#0D1117"/>
  <polygon points="522,171 534,179 522,187" fill="#0D1117"/>
  <polygon points="758,171 770,179 758,187" fill="#0D1117"/>
  <polygon points="994,171 1006,179 994,187" fill="#0D1117"/>

  <!-- specialist chips -->
  <text x="640" y="328" text-anchor="middle" fill="#8B949E" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Review specialists</text>
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="318" y="344" width="140" height="36" rx="18" fill="#21262D" stroke="#3D444D"/>
    <text x="388" y="367" text-anchor="middle" fill="#E6EDF3">Correctness</text>
    <rect x="478" y="344" width="140" height="36" rx="18" fill="#21262D" stroke="#3D444D"/>
    <text x="548" y="367" text-anchor="middle" fill="#E6EDF3">Security</text>
    <rect x="638" y="344" width="140" height="36" rx="18" fill="#21262D" stroke="#3D444D"/>
    <text x="708" y="367" text-anchor="middle" fill="#E6EDF3">Quality</text>
    <rect x="798" y="344" width="140" height="36" rx="18" fill="#21262D" stroke="#3D444D"/>
    <text x="868" y="367" text-anchor="middle" fill="#E6EDF3">Tests</text>
  </g>
</svg>
